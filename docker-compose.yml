services:
  postgres:
    image: postgres:18.1-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payments-net

  redis:
    image: redis:7-alpine
    container_name: payments-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payments-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: payments-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - payments-net

  api-gateway:
    build:
      context: .
      args:
        SERVICE_MODULE: api-gateway
    image: payments-platform/api-gateway:local
    container_name: payments-api-gateway
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - payments-net

  account-service:
    build:
      context: .
      args:
        SERVICE_MODULE: account-service
    image: payments-platform/account-service:local
    container_name: payments-account-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/payments
      SPRING_R2DBC_USERNAME: payments
      SPRING_R2DBC_PASSWORD: payments
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8081"
    networks:
      - payments-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-processor:
    build:
      context: .
      args:
        SERVICE_MODULE: payment-processor
    image: payments-platform/payment-processor:local
    container_name: payments-payment-processor
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/payments
      SPRING_R2DBC_USERNAME: payments
      SPRING_R2DBC_PASSWORD: payments
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_CREATED_TOPIC: payments.payment-created
    ports:
      - "8082:8082"
    networks:
      - payments-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE_MODULE: notification-service
    image: payments-platform/notification-service:local
    container_name: payments-notification-service
    environment:
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - payments-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  payments-net:
    driver: bridge
